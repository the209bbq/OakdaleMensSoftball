# Redeploy the existing Fly.io app. First-time create/volume/secrets are
# handled by scripts/deploy-fly.sh — this workflow only pushes a new image.
name: Deploy to Fly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --yes
