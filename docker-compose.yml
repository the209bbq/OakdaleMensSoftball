# One-command self-host:
#   cp .env.example .env   # then fill in secrets
#   docker compose up -d --build
#
# The image is built from the repo-root Dockerfile (Node 22, port 3001,
# DATA_DIR=/data). League data lives in the named volume oakdale-data.

services:
  app:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - oakdale-data:/data
    env_file: .env
    # Container always listens on 3001 (healthcheck + Dockerfile EXPOSE).
    # PORT in .env only changes the published host port via the mapping above.
    environment:
      PORT: "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  oakdale-data:
