# Fly.io config for Oakdale Men's Softball.
# Build uses the repo-root Dockerfile (fly deploy / fly launch pick it up;
# [build] names it explicitly). Secrets such as ADMIN_EMAIL, ADMIN_PASSWORD,
# ADMIN_NAME, SESSION_SECRET, SIGNUP_NOTIFY_EMAIL, and RESEND_API_KEY
# (or SMTP_*) are NOT in this file — set them with:
#   fly secrets set ADMIN_EMAIL=... ADMIN_PASSWORD=... ADMIN_NAME=... SESSION_SECRET=...
#   fly secrets set SIGNUP_NOTIFY_EMAIL=you@example.com RESEND_API_KEY=re_...
#
# Replace the placeholder app name (or let `fly launch` assign one).

app = "oakdale-mens-softball"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  SEED_DEMO_USERS = "false"
  PORT = "3001"
  PUBLIC_APP_URL = "https://oakdale-mens-softball.fly.dev"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "oakdale_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
